server:
  port: 8080

spring:
  application:
    name: backend-main
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 520MB
      max-request-size: 520MB

# Namespace app.* — bind vào com.app.common.config.AppProperties.
# Không hard-code giá trị nhạy cảm ở đây — mọi secret đọc qua biến môi trường (CLAUDE.md §7).
app:
  cors:
    allowed-origin: ${FE_ORIGIN:http://localhost:5173}
  fe-origin: ${FE_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0zMi1ieXRlcy1sb25nISE=}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    issuer: ${JWT_ISSUER:transflow}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
  credit:
    initial-grant-amount: ${CREDIT_INITIAL_GRANT_AMOUNT:100.0000}
  storage:
    endpoint: ${MEDIA_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:minioadmin}
    media-bucket: ${MEDIA_STORAGE_BUCKET:transflow-media}
