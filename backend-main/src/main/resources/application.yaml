server:
  port: 8080

spring:
  application:
    name: backend-main
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # RabbitMQ — pipeline media.stage.* (System_Architecture.md §2). Chưa có listener/
  # publisher nào ở iteration này (chỉ khởi tạo ConnectionFactory + health indicator),
  # dispatch thật sẽ nối vào MediaJobService khi worker queue được bật.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:transflow}
    password: ${RABBITMQ_PASSWORD:transflow}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
          multiplier: 2.0
  servlet:
    multipart:
      # Media asset (SRS §5.2): video ≤500MB — cap giữ cao hơn chút để service trả lỗi
      # nghiệp vụ thay vì container trả 413.
      max-file-size: 520MB
      max-request-size: 520MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.flywaydb: INFO

# Namespace app.* — bind vào com.app.common.config.AppProperties.
# Không hard-code giá trị nhạy cảm ở đây — mọi secret đọc qua biến môi trường (CLAUDE.md §7).
app:
  cors:
    allowed-origin: ${FE_ORIGIN:http://localhost:5173}
  fe-origin: ${FE_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0zMi1ieXRlcy1sb25nISE=}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    issuer: ${JWT_ISSUER:transflow}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      state-ttl-minutes: 10
      exchange-ttl-seconds: 120
  credit:
    initial-grant-amount: ${CREDIT_INITIAL_GRANT_AMOUNT:100.0000}
  storage:
    endpoint: ${MEDIA_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:minioadmin}
    media-bucket: ${MEDIA_STORAGE_BUCKET:transflow-media}
    presigned-ttl-seconds: ${MEDIA_STORAGE_PRESIGNED_TTL_SECONDS:3600}
    public-endpoint: ${MEDIA_STORAGE_PUBLIC_ENDPOINT:}
  media-job:
    max-batch-subtitle-updates: ${MEDIA_MAX_BATCH_SUBTITLE_UPDATES:200}
    max-bulk-download: ${MEDIA_MAX_BULK_DOWNLOAD:20}
    supported-source-langs: ${MEDIA_SUPPORTED_SOURCE_LANGS:vi,en,zh,ja,ko,fr,de,es,th,id,ru}
  media-worker:
    hmac-secret: ${MEDIA_WORKER_HMAC_SECRET:}
    base-url: ${MEDIA_WORKER_URL:http://localhost:8001}
  health-probe:
    timeout-ms: ${HEALTH_PROBE_TIMEOUT_MS:2000}
  transformation:
    capabilities-cache-ttl-seconds: ${TRANSFORMATION_CAPABILITIES_CACHE_TTL_SECONDS:5}
  crypto:
    provider-key-secret: ${PROVIDER_KEY_ENC_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    max-retries: 3
  rate-limit:
    voice-preview:
      max-requests: ${VOICE_PREVIEW_RATE_LIMIT_MAX_REQUESTS:5}
      window-seconds: ${VOICE_PREVIEW_RATE_LIMIT_WINDOW_SECONDS:60}
    forgot-password-otp:
      max-requests: ${FORGOT_OTP_RATE_LIMIT_MAX_REQUESTS:5}
      window-seconds: ${FORGOT_OTP_RATE_LIMIT_WINDOW_SECONDS:600}
  platform-admin:
    seed-on-startup: ${PLATFORM_ADMIN_SEED_ON_STARTUP:false}
    emails: ${PLATFORM_ADMIN_EMAILS:}
