# TransFlow — bắt IP bị nginx host từ chối vì vượt limit_req / limit_conn (trả 429).
# nginx ghi vào error.log, ví dụ:
#   ... [error] 123#123: *456 limiting requests, excess: 80.520 by zone "tf_api", client: 1.2.3.4, server: ...
#   ... [error] 123#123: *789 limiting connections by zone "tf_upload", client: 1.2.3.4, server: ...
# "delaying request" (mức warn, request vẫn được phục vụ) không bị tính.
# Vùng tf_upload KHÔNG bị tính: đó là giới hạn số chunk upload chạy cùng lúc (limit_conn), chạm vào khi
# người dùng thật upload nhiều video hoặc mở nhiều tab — trình duyệt tự thử lại chunk, không phải flood.
# Flood vẫn bị bắt qua tf_api / tf_auth / tf_storage (limit_req) và tf_conn (limit_conn toàn site).
[Definition]
failregex = ^\s*\[[a-z]+\] \d+#\d+: \*\d+ limiting (?:requests, excess: [\d.]+|connections) by zone "(?!tf_upload")[^"]+", client: <HOST>,
ignoreregex =
datepattern = {^LN-BEG}
