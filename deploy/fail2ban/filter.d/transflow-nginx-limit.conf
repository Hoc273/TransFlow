# TransFlow — bắt IP bị nginx host từ chối vì vượt limit_req / limit_conn (trả 429).
# nginx ghi vào error.log, ví dụ:
#   ... [error] 123#123: *456 limiting requests, excess: 80.520 by zone "tf_api", client: 1.2.3.4, server: ...
#   ... [error] 123#123: *789 limiting connections by zone "tf_upload", client: 1.2.3.4, server: ...
# "delaying request" (mức warn, request vẫn được phục vụ) không bị tính.
[Definition]
failregex = ^\s*\[[a-z]+\] \d+#\d+: \*\d+ limiting (?:requests, excess: [\d.]+|connections) by zone "[^"]+", client: <HOST>,
ignoreregex =
datepattern = {^LN-BEG}
