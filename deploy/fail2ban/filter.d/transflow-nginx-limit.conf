# TransFlow — bắt IP bị nginx host từ chối vì vượt limit_req / limit_conn (trả 429).
# nginx ghi vào error.log, ví dụ:
#   ... [error] 123#123: *456 limiting requests, excess: 400.520 by zone "tf_api", client: 1.2.3.4, server: ...
#   ... [error] 123#123: *789 limiting connections by zone "tf_user_upload", client: 1.2.3.4, server: ...
# "delaying request" (mức warn, request vẫn được phục vụ) không bị tính.
# Chỉ tính vùng khoá theo IP (tf_api / tf_auth / tf_storage / tf_conn). Vùng tf_user_* khoá theo người
# dùng: nhiều người chung 1 IP (CGNAT, văn phòng) — 1 người vượt ngưỡng mà chặn IP thì cả mạng mất
# truy cập. tf_upload là tên cũ của tf_user_upload (config nginx trước khi deploy lại).
[Definition]
failregex = ^\s*\[[a-z]+\] \d+#\d+: \*\d+ limiting (?:requests, excess: [\d.]+|connections) by zone "(?!tf_user_|tf_upload")[^"]+", client: <HOST>,
ignoreregex =
datepattern = {^LN-BEG}
