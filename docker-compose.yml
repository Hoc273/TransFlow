services:
  postgres:
    image: postgres:16-alpine
    container_name: transflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transflow_mini}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: transflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: transflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: transflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-transflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-transflow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # FastAPI AI Gateway (STT / Translate / Summarize / TTS / Vision)
  backend-ai:
    build:
      context: ./backend-ai
    container_name: transflow-backend-ai
    environment:
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEDIA_STORAGE_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
      GEN_CACHE_ENABLED: ${GEN_CACHE_ENABLED:-true}
      GEN_CACHE_CAP_BYTES: ${GEN_CACHE_CAP_BYTES:-1073741824}
      GEN_CACHE_SWEEP_INTERVAL: ${GEN_CACHE_SWEEP_INTERVAL:-1800}
      GEN_CACHE_PREFIX: ${GEN_CACHE_PREFIX:-generated-assets/v1}
      GEN_CACHE_TTL_SECONDS: ${GEN_CACHE_TTL_SECONDS:-86400}
      GEN_CACHE_FLUSH_INTERVAL: ${GEN_CACHE_FLUSH_INTERVAL:-60}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      SEPARATION_ENGINE_ID: ${SEPARATION_ENGINE_ID:-local_demucs}
      SEPARATION_MODEL_ID: ${SEPARATION_MODEL_ID:-htdemucs}
      SEPARATION_DEMUCS_EXECUTABLE: python
      SEPARATION_MAX_CONCURRENT_JOBS: 1
      MOCK_MODE: "false"
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Media Processing Worker (FFmpeg extract / render / audio dub mix + HMAC callbacks)
  media-worker:
    build:
      context: ./backend-media-worker
    container_name: transflow-media-worker
    environment:
      MEDIA_WORKER_MINIO_ENDPOINT: http://minio:9000
      MEDIA_WORKER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_WORKER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEDIA_WORKER_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
      MEDIA_WORKER_CALLBACK_SECRET: ${MEDIA_CALLBACK_SECRET:-change-me}
      MEDIA_WORKER_CALLBACK_BASE_URL: ${MEDIA_CALLBACK_BASE_URL:-http://host.docker.internal:8080}
      MEDIA_WORKER_REVISION: ${MEDIA_WORKER_REVISION:-unknown}
      MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_MS: ${MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_MS:-500}
      MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_PCT: ${MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_PCT:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${MEDIA_WORKER_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: create media bucket in MinIO
  minio-init:
    image: minio/mc:latest
    container_name: transflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_MEDIA_BUCKET:-transflow-media} &&
      echo 'minio bucket transflow-media ready';
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
  rabbitmqdata:
