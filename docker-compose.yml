# Bảo mật mạng: mọi cổng hạ tầng chỉ bind 127.0.0.1 (VPS all-in-one: backend-main trên host
# vẫn truy cập qua localhost, nhưng Internet không chạm được DB/Redis/MQ/MinIO/AI/worker).
# Muốn mở ra ngoài phải chủ động đổi BIND_ADDR — không bao giờ mở Postgres/Redis ra public.
services:
  postgres:
    image: postgres:16-alpine
    container_name: transflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transflow}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: transflow-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # REDIS_PASSWORD rỗng = không auth (chỉ dev); production phải đặt (backend-main đọc cùng biến).
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: transflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # API 9000 phục vụ presigned URL cho trình duyệt: public hoá qua reverse proxy TLS
      # (MEDIA_STORAGE_PUBLIC_ENDPOINT), không mở trực tiếp. Console 9001 chỉ localhost/SSH tunnel.
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: transflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-transflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-transflow}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # FastAPI AI Gateway (STT / Translate / Summarize / TTS / Vision)
  backend-ai:
    build:
      context: ./backend-ai
    container_name: transflow-backend-ai
    environment:
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEDIA_STORAGE_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
      GEN_CACHE_ENABLED: ${GEN_CACHE_ENABLED:-true}
      GEN_CACHE_CAP_BYTES: ${GEN_CACHE_CAP_BYTES:-1073741824}
      GEN_CACHE_SWEEP_INTERVAL: ${GEN_CACHE_SWEEP_INTERVAL:-1800}
      GEN_CACHE_PREFIX: ${GEN_CACHE_PREFIX:-generated-assets/v1}
      GEN_CACHE_TTL_SECONDS: ${GEN_CACHE_TTL_SECONDS:-86400}
      GEN_CACHE_FLUSH_INTERVAL: ${GEN_CACHE_FLUSH_INTERVAL:-60}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      SEPARATION_ENGINE_ID: ${SEPARATION_ENGINE_ID:-local_demucs}
      SEPARATION_MODEL_ID: ${SEPARATION_MODEL_ID:-htdemucs}
      SEPARATION_DEMUCS_EXECUTABLE: python
      SEPARATION_CPU_FALLBACK: ${SEPARATION_CPU_FALLBACK:-true}
      SEPARATION_MAX_CONCURRENT_JOBS: 1
      MOCK_MODE: "false"
      # Chỉ nhận request có X-Internal-Token khớp (gửi từ backend-main).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # FreeLLMAPI — OpenAI-compatible proxy gom free tier của nhiều LLM provider
  # (https://github.com/tashfeenahmed/freellmapi). Là 1 key trong pool platform
  # (tier FREE, priority 10): backend-ai gọi http://freellmapi:3001/v1 trong docker network.
  # Dashboard chỉ bind localhost — trên VPS mở bằng SSH tunnel:
  #   ssh -L 3001:127.0.0.1:3001 <vps>  rồi vào http://localhost:3001
  # Lần đầu: tạo tài khoản admin, thêm key các provider miễn phí (Groq, Gemini, ...) ở trang Keys,
  # tạo API key "freellmapi-..." rồi đặt vào FREELLMAPI_API_KEY cho backend-main.
  # Bật bằng profile: docker compose --profile freellmapi up -d  (hoặc COMPOSE_PROFILES=freellmapi trong .env)
  freellmapi:
    # Upstream + TransFlow speech patch (Cloudflare Deepgram TTS body, speech language routing,
    # TTS key rotation/cooldown). Rebuild from infra/freellmapi/Dockerfile.
    image: duckziec/freellmapi:speech-patch-1
    container_name: transflow-freellmapi
    profiles: ["freellmapi"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Bắt buộc, giữ cố định (mã hoá key provider trong SQLite): openssl rand -hex 32
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:${FREELLMAPI_PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/ping >/dev/null 2>&1 || curl -fs http://localhost:3001/api/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Media Processing Worker (FFmpeg extract / render / audio dub mix + HMAC callbacks)
  media-worker:
    build:
      context: ./backend-media-worker
    container_name: transflow-media-worker
    environment:
      MEDIA_WORKER_MINIO_ENDPOINT: http://minio:9000
      MEDIA_WORKER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_WORKER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEDIA_WORKER_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
      MEDIA_WORKER_CALLBACK_SECRET: ${MEDIA_WORKER_CALLBACK_SECRET:-change-me}
      MEDIA_WORKER_CALLBACK_BASE_URL: ${MEDIA_CALLBACK_BASE_URL:-http://host.docker.internal:8080}
      MEDIA_WORKER_REVISION: ${MEDIA_WORKER_REVISION:-unknown}
      MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_MS: ${MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_MS:-500}
      MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_PCT: ${MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_PCT:-2}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MEDIA_WORKER_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # backend-main chạy bằng IDE trên host (port 8080), KHÔNG container hóa ở
  # iteration này để tránh tranh port. Backend trên host nối infra qua localhost
  # (DB_HOST/REDIS_HOST/RABBITMQ_HOST mặc định trong application.yaml) — trùng
  # với ports đã publish bên dưới.
  #
  # ---- BẬT KHI MUỐN CONTAINER HÓA BACKEND (bỏ comment toàn block) ----
  # LƯU Ý: phải tắt backend chạy bằng IDE trước để khỏi tranh host port 8080.
  # backend-main:
  #   build:
  #     context: ./backend-main
  #   container_name: transflow-backend-main
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     # DB phải trùng DB mà service postgres khởi tạo (POSTGRES_DB).
  #     DB_NAME: ${POSTGRES_DB:-transflow}
  #     DB_USERNAME: ${POSTGRES_USER:-postgres}
  #     DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  #     INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
  #     STRICT_SECRETS: ${STRICT_SECRETS:-true}
  #     REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
  #     RABBITMQ_HOST: rabbitmq
  #     RABBITMQ_PORT: 5672
  #     RABBITMQ_USER: ${RABBITMQ_USER:-transflow}
  #     RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-transflow}
  #     AI_SERVICE_URL: http://backend-ai:8000
  #     MEDIA_WORKER_URL: http://media-worker:8000
  #     MEDIA_CALLBACK_BASE_URL: http://backend-main:8080
  #     MEDIA_WORKER_CALLBACK_SECRET: ${MEDIA_WORKER_CALLBACK_SECRET:-change-me}
  #     MEDIA_STORAGE_ENDPOINT: http://minio:9000
  #     MEDIA_STORAGE_PUBLIC_ENDPOINT: ${MEDIA_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
  #     MEDIA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  #     MEDIA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  #     MEDIA_STORAGE_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
  #     # URL nội bộ tới media-worker trong docker network (probe /health cho
  #     # /api/transformation/capabilities); phải khớp MEDIA_WORKER_HMAC_SECRET của worker.
  #     MEDIA_WORKER_URL: ${MEDIA_WORKER_INTERNAL_URL:-http://media-worker:8000}
  #     MEDIA_WORKER_HMAC_SECRET: ${MEDIA_WORKER_HMAC_SECRET:-}
  #     FE_ORIGIN: http://localhost:5173
  #     JWT_SECRET: ${JWT_SECRET:-}
  #     JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
  #     JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
  #     JWT_ISSUER: ${JWT_ISSUER:-transflow}
  #     GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  #     GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  #     GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
  #     CREDIT_INITIAL_GRANT_AMOUNT: ${CREDIT_INITIAL_GRANT_AMOUNT:-100.0000}
  #     MEDIA_RETENTION: ${MEDIA_RETENTION:-P3D}
  #     FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
  #     FREELLMAPI_BASE_URL: http://freellmapi:3001/v1
  #     FREELLMAPI_MODEL: ${FREELLMAPI_MODEL:-auto}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   ports:
  #     - "${BACKEND_MAIN_PORT:-8080}:8080"
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 60s
  #
  # ---- BẬT KHI MUỐN SERVE FRONTEND BẰNG NGINX (bỏ comment toàn block) ----
  # Yêu cầu service backend-main ở trên cũng được bật (nginx proxy /api/* sang
  # http://backend-main:8080). VITE_* bake vào bundle lúc build — đổi URL phải
  # build lại image.
  # frontend:
  #   build:
  #     context: ./frontend
  #     args:
  #       VITE_API_BASE_URL: /api
  #       VITE_DEFAULT_LANGUAGE: en
  #       VITE_ENABLE_GLOBAL_SEARCH: "false"
  #       VITE_ENABLE_GOOGLE_AUTH: "true"
  #       VITE_ENABLE_QA_OVERRIDE: "true"
  #       VITE_ENABLE_NARRATIVE_REVIEW_AI: "true"
  #   container_name: transflow-frontend
  #   depends_on:
  #     backend-main:
  #       condition: service_healthy
  #   ports:
  #     - "${FRONTEND_PORT:-5173}:80"

  # One-shot job: create media bucket in MinIO
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: transflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_MEDIA_BUCKET:-transflow-media} &&
      case $$(mc ilm rule ls local/${MINIO_MEDIA_BUCKET:-transflow-media} 2>&1) in *tmp/downloads*) ;; *) mc ilm rule add --expire-days 1 --prefix tmp/downloads/ local/${MINIO_MEDIA_BUCKET:-transflow-media} ;; esac &&
      echo \"minio bucket ${MINIO_MEDIA_BUCKET:-transflow-media} ready\";
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
  rabbitmqdata:
  freellmapi-data:
