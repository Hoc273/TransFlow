# TransFlow — production stack (1 VPS, 1 instance mỗi service).
#
# Chạy trên server (CD tự làm, xem deploy/server-deploy.sh):
#   docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.deploy up -d
#   .env        = nội dung secret ENV_PROD (mẫu: .env.prod.example)
#   .env.deploy = IMAGE_REGISTRY / IMAGE_TAG do CD ghi mỗi lần deploy
#
# Mạng: KHÔNG service nào publish ra Internet. nginx trên host terminate TLS rồi proxy vào:
#   https://${DOMAIN}         -> 127.0.0.1:${FRONTEND_PORT:-8081}  (frontend nginx, /api -> backend-main)
#   https://${STORAGE_DOMAIN} -> 127.0.0.1:${MINIO_PORT:-9000}     (SeaweedFS S3 presigned URL cho trình duyệt)
# SeaweedFS admin UI (23646), RabbitMQ management (15672), FreeLLMAPI dashboard (3001): chỉ qua SSH tunnel.
#
# Tài nguyên (tính cho VPS 4 vCPU / 8GB, chỉnh qua biến *_CPUS / *_MEM_LIMIT trong .env):
#   media-worker  ≤3 vCPU, 2.5GB, cpu_shares 512   (render ffmpeg — nặng nhất)
#   backend-ai    ≤2 vCPU, 1.5GB, cpu_shares 512   (ffmpeg STT/keyframe)
#   backend-main  2GB (heap ~1.5GB), cpu_shares 1024
#   còn lại (postgres, redis, rabbitmq, seaweedfs, freellmapi, frontend) không giới hạn, shares 1024
# Quota chặn trần; shares quyết định ai thắng khi CPU bận => lúc render, API/DB vẫn có ≥1 core
# và được ưu tiên; lúc rảnh mọi service dùng được toàn bộ 4 core.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-service: &default-service
  restart: unless-stopped
  logging: *default-logging

services:
  postgres:
    <<: *default-service
    image: postgres:16-alpine
    container_name: transflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *default-service
    image: redis:7-alpine
    container_name: transflow-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage S3-compatible. MinIO đã ngừng phát hành image miễn phí (Docker Hub gỡ, quay.io 401
  # từ 09/2026) => dùng SeaweedFS `weed mini` (master+volume+filer+S3 1 process, Apache-2.0).
  # Giữ tên biến MINIO_* trong .env làm access/secret key S3 để không phải đổi secret ENV_PROD.
  seaweedfs:
    <<: *default-service
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-4.47}
    container_name: transflow-seaweedfs
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      # weed mini tự tạo bucket này khi khởi động (idempotent).
      S3_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
    ports:
      # S3 API: host nginx (STORAGE_DOMAIN) proxy vào. Admin UI (23646): chỉ SSH tunnel.
      - "127.0.0.1:${MINIO_PORT:-9000}:8333"
      - "127.0.0.1:${SEAWEEDFS_ADMIN_PORT:-23646}:23646"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: file tạm tmp/downloads/ tự xoá sau 1 ngày (TTL filer; idempotent, chạy lại mỗi lần deploy).
  seaweedfs-init:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-4.47}
    container_name: transflow-seaweedfs-init
    restart: "no"
    logging: *default-logging
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
    entrypoint: >
      /bin/sh -c "
      echo \"fs.configure -locationPrefix /buckets/$$MEDIA_BUCKET/tmp/downloads/ -ttl 1d -apply\"
      | weed shell -master=seaweedfs:9333 | grep -q '\"ttl\": \"1d\"' &&
      echo \"seaweedfs bucket $$MEDIA_BUCKET ready\"
      "

  rabbitmq:
    <<: *default-service
    image: rabbitmq:3.13-management-alpine
    container_name: transflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
      # consumer_timeout mặc định 30 phút = đúng bằng budget dài nhất của stage AI (TTS/tách âm)
      # => stage chạy sát budget bị broker đóng channel (PRECONDITION_FAILED 406) và gửi lại message.
      # 1 giờ để watchdog (retry sau budget) luôn xử lý trước broker.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 3600000"
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # FreeLLMAPI — pool LLM miễn phí (key tier FREE trong pool platform).
  # Lần đầu: ssh -L 3001:127.0.0.1:3001 <vps> -> http://localhost:3001, tạo admin + key provider,
  # tạo API key "freellmapi-..." rồi đặt FREELLMAPI_API_KEY trong secret ENV_PROD và deploy lại.
  freellmapi:
    <<: *default-service
    image: duckziec/freellmapi:speech-patch-1
    container_name: transflow-freellmapi
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?FREELLMAPI_ENCRYPTION_KEY required}
    ports:
      - "127.0.0.1:${FREELLMAPI_PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/ping >/dev/null 2>&1 || curl -fs http://localhost:3001/api/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend-ai:
    <<: *default-service
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY required}/transflow-backend-ai:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: transflow-backend-ai
    # ffmpeg decode/cắt audio STT, trích keyframe, tách nguồn CPU: giới hạn như worker để không lấn API.
    cpus: ${BACKEND_AI_CPUS:-2}
    cpu_shares: 512
    mem_limit: ${BACKEND_AI_MEM_LIMIT:-1536m}
    environment:
      MEDIA_STORAGE_ENDPOINT: http://seaweedfs:8333
      MEDIA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      MEDIA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEDIA_STORAGE_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
      GEN_CACHE_ENABLED: ${GEN_CACHE_ENABLED:-true}
      GEN_CACHE_CAP_BYTES: ${GEN_CACHE_CAP_BYTES:-1073741824}
      GEN_CACHE_SWEEP_INTERVAL: ${GEN_CACHE_SWEEP_INTERVAL:-1800}
      GEN_CACHE_PREFIX: ${GEN_CACHE_PREFIX:-generated-assets/v1}
      GEN_CACHE_TTL_SECONDS: ${GEN_CACHE_TTL_SECONDS:-86400}
      GEN_CACHE_FLUSH_INTERVAL: ${GEN_CACHE_FLUSH_INTERVAL:-60}
      APP_VERSION: ${IMAGE_TAG}
      SEPARATION_ENGINE_ID: ${SEPARATION_ENGINE_ID:-local_demucs}
      SEPARATION_MODEL_ID: ${SEPARATION_MODEL_ID:-htdemucs}
      SEPARATION_DEMUCS_EXECUTABLE: python
      SEPARATION_CPU_FALLBACK: ${SEPARATION_CPU_FALLBACK:-true}
      SEPARATION_MAX_CONCURRENT_JOBS: 1
      MOCK_MODE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN required}
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  media-worker:
    <<: *default-service
    image: ${IMAGE_REGISTRY}/transflow-media-worker:${IMAGE_TAG}
    container_name: transflow-media-worker
    # Render (ffmpeg) tối đa 3/4 vCPU: luôn chừa ≥1 core cho API/DB/queue. cpu_shares thấp hơn
    # mặc định (1024) => khi tranh CPU, backend-main/postgres/rabbitmq được ưu tiên.
    cpus: ${MEDIA_WORKER_CPUS:-3}
    cpu_shares: 512
    mem_limit: ${MEDIA_WORKER_MEM_LIMIT:-2560m}
    environment:
      MEDIA_WORKER_MINIO_ENDPOINT: http://seaweedfs:8333
      MEDIA_WORKER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MEDIA_WORKER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEDIA_WORKER_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
      MEDIA_WORKER_CALLBACK_SECRET: ${MEDIA_WORKER_CALLBACK_SECRET:?MEDIA_WORKER_CALLBACK_SECRET required}
      MEDIA_WORKER_CALLBACK_BASE_URL: http://backend-main:8080
      MEDIA_WORKER_REVISION: ${IMAGE_TAG}
      MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_MS: ${MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_MS:-500}
      MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_PCT: ${MEDIA_WORKER_VALIDATION_DURATION_TOLERANCE_PCT:-2}
      MEDIA_WORKER_RENDER_MAX_CONCURRENCY: ${MEDIA_WORKER_RENDER_MAX_CONCURRENCY:-1}
      MEDIA_WORKER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-main:
    <<: *default-service
    image: ${IMAGE_REGISTRY}/transflow-backend-main:${IMAGE_TAG}
    container_name: transflow-backend-main
    # Giới hạn RAM container để JVM (MaxRAMPercentage=75) lấy ~1.5GB heap, không phải 75% RAM cả VPS.
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpu_shares: 1024
    environment:
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # ── Hardening (docs/Security_Hardening.md) ──
      STRICT_SECRETS: "true"
      REQUIRE_HTTPS: "true"
      AUTH_COOKIE_SECURE: "true"
      FORWARD_HEADERS_STRATEGY: native
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      JWT_SESSION_MAX_DAYS: ${JWT_SESSION_MAX_DAYS:-30}
      JWT_ISSUER: ${JWT_ISSUER:-transflow}
      PROVIDER_KEY_ENC_SECRET: ${PROVIDER_KEY_ENC_SECRET:?PROVIDER_KEY_ENC_SECRET required}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_DURATION: ${LOGIN_LOCK_DURATION:-PT15M}
      AUTH_THROTTLE_MAX_REQUESTS: ${AUTH_THROTTLE_MAX_REQUESTS:-30}
      AUTH_THROTTLE_WINDOW: ${AUTH_THROTTLE_WINDOW:-PT5M}
      # ── URL công khai ──
      FE_ORIGIN: https://${DOMAIN:?DOMAIN required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/auth/google/callback
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # ── Service nội bộ ──
      AI_SERVICE_URL: http://backend-ai:8000
      MEDIA_WORKER_URL: http://media-worker:8000
      MEDIA_CALLBACK_BASE_URL: http://backend-main:8080
      MEDIA_WORKER_CALLBACK_SECRET: ${MEDIA_WORKER_CALLBACK_SECRET}
      MEDIA_STORAGE_ENDPOINT: http://seaweedfs:8333
      MEDIA_STORAGE_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?STORAGE_DOMAIN required}
      MEDIA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      MEDIA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEDIA_STORAGE_BUCKET: ${MINIO_MEDIA_BUCKET:-transflow-media}
      MEDIA_STORAGE_PRESIGNED_TTL_SECONDS: ${MEDIA_STORAGE_PRESIGNED_TTL_SECONDS:-3600}
      # ── Nghiệp vụ ──
      CREDIT_INITIAL_GRANT_AMOUNT: ${CREDIT_INITIAL_GRANT_AMOUNT:-100.0000}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
      MEDIA_RETENTION: ${MEDIA_RETENTION:-P3D}
      PLATFORM_PROVIDER_CHECK_INTERVAL: ${PLATFORM_PROVIDER_CHECK_INTERVAL:-PT30M}
      PLATFORM_ADMIN_SEED_ON_STARTUP: ${PLATFORM_ADMIN_SEED_ON_STARTUP:-false}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      FREELLMAPI_BASE_URL: http://freellmapi:3001/v1
      FREELLMAPI_MODEL: ${FREELLMAPI_MODEL:-auto}
      FREELLMAPI_CAPABILITIES: ${FREELLMAPI_CAPABILITIES:-TRANSLATE}
      FREELLMAPI_PRIORITY: ${FREELLMAPI_PRIORITY:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend-ai:
        condition: service_started
      media-worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    <<: *default-service
    image: ${IMAGE_REGISTRY}/transflow-frontend:${IMAGE_TAG}
    container_name: transflow-frontend
    # Không depends_on backend-main: nginx resolve backend-main lúc request (frontend/nginx.conf),
    # nên SPA vẫn phục vụ trong ~90s Spring khởi động mỗi lần deploy thay vì toàn site 502.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"

volumes:
  pgdata:
  redisdata:
  seaweedfs-data:
  rabbitmqdata:
  freellmapi-data:
