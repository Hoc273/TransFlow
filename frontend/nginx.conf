# TransFlow frontend — nginx serve SPA + proxy API sang backend-main.
# TLS: terminate HTTPS ở reverse proxy phía trước (Caddy/Cloudflare/nginx host) và chuyển
# X-Forwarded-Proto vào đây; nếu container này tự nhận traffic public thì bật block 443 bên dưới.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Upload video ≤500MB (SRS §5.2) — khớp spring.servlet.multipart (520MB).
    client_max_body_size 520m;

    # Bắt buộc HTTPS: proxy phía trước báo request gốc là http -> redirect sang https.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ── Security headers (always = cả response lỗi) ──
    # script-src 'self': chặn inline/injected script (XSS). Ảnh/video/link tải lấy từ MinIO
    # presigned URL (MEDIA_STORAGE_PUBLIC_ENDPOINT) nên img/media/connect cho phép http(s).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Trình duyệt chỉ áp HSTS khi trang được tải qua HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API (VITE_API_BASE_URL=/api): forward nguyên path /api/* sang Spring Boot.
    location /api/ {
        proxy_pass http://backend-main:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Giữ scheme gốc từ proxy TLS phía trước (nếu có), để Spring đặt cookie Secure / HSTS đúng.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Endpoint nội bộ (worker callback) không bao giờ đi qua cổng public.
    location /internal/ {
        return 404;
    }

    # Asset có hash trong tên: cache lâu.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header trong location ghi đè header ở server -> lặp lại các header bảo mật chính.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: mọi route còn lại trả index.html cho react-router.
    location / {
        try_files $uri /index.html;
    }
}

# Scheme gốc: ưu tiên X-Forwarded-Proto của proxy TLS phía trước, không có thì dùng $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

