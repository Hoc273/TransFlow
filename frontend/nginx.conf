# TransFlow frontend — nginx serve SPA + proxy API sang backend-main.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API (VITE_API_BASE_URL=/api): forward nguyên path /api/* sang Spring Boot.
    location /api/ {
        proxy_pass http://backend-main:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: mọi route còn lại trả index.html cho react-router.
    location / {
        try_files $uri /index.html;
    }
}
