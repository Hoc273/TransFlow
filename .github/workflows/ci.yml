name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend-main: Spring Boot Core (121 tests)
  # ─────────────────────────────────────────────────────────────
  backend-main:
    name: backend-main / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Make Maven Wrapper Executable
        run: chmod +x backend-main/mvnw
      - name: Run Spring Boot tests
        working-directory: backend-main
        run: ./mvnw test -B 2>&1 | tee ../backend-main.log
      - name: Failure summary (backend-main)
        if: failure()
        run: |
          echo "## Failure summary — backend-main" >> $GITHUB_STEP_SUMMARY
          grep -A2 "FAILURE\|ERROR" ../backend-main.log | head -n 100 >> $GITHUB_STEP_SUMMARY || true
          cat target/surefire-reports/*.txt 2>/dev/null | grep -E "Tests run|FAILURE|ERROR" | head -n 30 >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-main-surefire-reports
          path: |
            backend-main/target/surefire-reports/
            backend-main.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Backend-AI: FastAPI Gateway (440+ pytest-asyncio tests)
  # ─────────────────────────────────────────────────────────────
  backend-ai:
    name: backend-ai / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend-ai/requirements.txt
      - name: Install dependencies
        working-directory: backend-ai
        run: |
          pip install -r requirements.txt
          pip list | grep -E "pytest|anyio"
      - name: Run pytest
        working-directory: backend-ai
        run: |
          pytest --tb=short -v 2>&1 | tee ../backend-ai.log
          python - << 'PY'
          import re, pathlib
          log = pathlib.Path("../backend-ai.log").read_text()
          m_pass = re.search(r"(\d+) passed", log)
          passed = int(m_pass.group(1)) if m_pass else 0
          assert passed >= 440, f"Expected >=440 passed, got {passed}"
          m_fail = re.search(r"(\d+) failed", log)
          if m_fail and int(m_fail.group(1)) > 0:
              raise SystemExit(f"FAIL detected: {m_fail.group(0)}")
          print(f"backend-ai: {passed} passed — OK")
          PY
      - name: Failure summary (backend-ai)
        if: failure()
        run: |
          echo "## Failure summary — backend-ai" >> $GITHUB_STEP_SUMMARY
          grep -E "FAILED|ERROR" ../backend-ai.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-ai-pytest-report
          path: |
            backend-ai.log
            backend-ai/.pytest_cache/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Media-worker: Python FFmpeg Worker (199 tests)
  # ─────────────────────────────────────────────────────────────
  media-worker:
    name: media-worker / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend-media-worker/requirements.txt
      - name: Install dependencies
        working-directory: backend-media-worker
        run: pip install -r requirements.txt
      - name: Run pytest (media-worker)
        working-directory: backend-media-worker
        run: |
          pytest --tb=short -v 2>&1 | tee ../media-worker.log
          python - << 'PY'
          import re, pathlib
          log = pathlib.Path("../media-worker.log").read_text()
          assert "passed" in log, "media-worker tests must pass"
          m_fail = re.search(r"(\d+) failed", log)
          if m_fail and int(m_fail.group(1)) > 0:
              raise SystemExit(f"FAIL detected: {m_fail.group(0)}")
          print("media-worker OK")
          PY
      - name: Failure summary (media-worker)
        if: failure()
        run: |
          echo "## Failure summary — media-worker" >> $GITHUB_STEP_SUMMARY
          grep -E "FAILED|ERROR" ../media-worker.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-worker-pytest-report
          path: media-worker.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Frontend: React 19 + Vite (TypeScript + Vitest + Build)
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: frontend / test + tsc + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc -b --verbose 2>&1 | tee ../frontend-tsc.log
      - name: Run vitest
        working-directory: frontend
        run: |
          npm test 2>&1 | tee ../frontend-test.log
          python - << 'PY'
          import pathlib, re
          log = pathlib.Path("../frontend-test.log").read_text()
          assert "passed" in log.lower(), "frontend tests must pass"
          m_fail = re.search(r"(\d+) failed", log)
          if m_fail and int(m_fail.group(1)) > 0:
              raise SystemExit(f"FAIL detected: {m_fail.group(0)}")
          print("frontend test OK")
          PY
      - name: Production Build
        working-directory: frontend
        run: npm run build
      - name: Failure summary (frontend)
        if: failure()
        run: |
          echo "## Failure summary — frontend" >> $GITHUB_STEP_SUMMARY
          grep -E "FAILED|ERROR" ../frontend-test.log ../frontend-tsc.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: |
            frontend-test.log
            frontend-tsc.log
            frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Gate: Verify all 4 Core Services Pass
  # ─────────────────────────────────────────────────────────────
  ci-status:
    name: CI status (gate)
    runs-on: ubuntu-latest
    needs:
      - backend-main
      - backend-ai
      - media-worker
      - frontend
    if: always()
    steps:
      - name: Check all core services green
        run: |
          echo "backend-main: ${{ needs.backend-main.result }}"
          echo "backend-ai: ${{ needs.backend-ai.result }}"
          echo "media-worker: ${{ needs.media-worker.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend-main.result }}" != "success" ] || \
             [ "${{ needs.backend-ai.result }}" != "success" ] || \
             [ "${{ needs.media-worker.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "## CI RED — one or more services failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## CI GREEN — all 4 core services passed" >> $GITHUB_STEP_SUMMARY
